services:
  vrising:
    # L'image vient du registre, construite et publiee par GitHub Actions
    # (.github/workflows/publier-image.yml). Pas de section `build:` : sa
    # presence ferait construire `docker compose up` en local des que l'image
    # manque, au lieu de la tirer -- le deploiement produirait alors une image
    # differente de celle qui a passe la porte de verification de la CI.
    # Pour construire deliberement en local :
    #   docker build -t ghcr.io/aymeric-t2m/vrising:latest .
    image: ghcr.io/aymeric-t2m/vrising:latest
    container_name: vrising-server
    restart: unless-stopped
    # Strictement superieur au SHUTDOWN_TIMEOUT de l'entrypoint (300s), pour que
    # Docker ne tue jamais le conteneur avant la fin de l'arret ordonne.
    # ~220s mesures en Tache 1 ; la marge couvre un serveur peuple.
    stop_grace_period: 330s
    ports:
      - "${VR_GAME_PORT}:${VR_GAME_PORT}/udp"
      - "${VR_QUERY_PORT}:${VR_QUERY_PORT}/udp"
    environment:
      VR_SERVER_NAME: ${VR_SERVER_NAME}
      VR_DESCRIPTION: ${VR_DESCRIPTION}
      VR_PASSWORD: ${VR_PASSWORD}
      VR_GAME_PORT: ${VR_GAME_PORT}
      VR_QUERY_PORT: ${VR_QUERY_PORT}
      VR_BIND_ADDRESS: ${VR_BIND_ADDRESS}
      VR_LIST_ON_EOS: ${VR_LIST_ON_EOS}
      VR_LIST_ON_STEAM: ${VR_LIST_ON_STEAM}
      VR_HIDE_IP_ADDRESS: ${VR_HIDE_IP_ADDRESS}
      VR_SECURE: ${VR_SECURE}
      VR_MAX_USERS: ${VR_MAX_USERS}
      VR_LOWER_FPS_WHEN_EMPTY: ${VR_LOWER_FPS_WHEN_EMPTY}
      VR_SAVE_NAME: ${VR_SAVE_NAME}
      VR_SAVE_COUNT: ${VR_SAVE_COUNT}
      VR_SAVE_INTERVAL: ${VR_SAVE_INTERVAL}
      VR_PRESET: ${VR_PRESET}
      VR_DIFFICULTY_PRESET: ${VR_DIFFICULTY_PRESET}
      PUID: ${PUID}
      PGID: ${PGID}
      VRISING_ADMINS: ${VRISING_ADMINS}
      VRISING_BANS: ${VRISING_BANS}
      RCON_PASSWORD: ${RCON_PASSWORD}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
      TZ: ${TZ}
    volumes:
      - ./vrising-persistent-data:/opt/vrising/save-data
      # Le prefixe Wine ne peut pas etre utilise depuis la couche image (crash
      # mesure). L entrypoint y copie le prefixe au premier demarrage.
      # Bind mount et non volume nomme : l image ne fournit aucun contenu sous
      # .wine-run, donc rien a auto-peupler et les deux sont equivalents au
      # runtime. Ces ~1,4 Go sont exclus du contexte de build (.dockerignore).
      - ./vrising-wine-prefix:/opt/vrising/.wine-run
      - type: bind
        source: ./config/ServerGameSettings.json
        target: /config/ServerGameSettings.json
        read_only: true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Mise a jour automatique du serveur des qu'une nouvelle image est publiee.
  #
  # WATCHTOWER_TIMEOUT EST VITAL, et sa valeur par defaut (10 s) detruirait des
  # mondes. Watchtower arrete les conteneurs avec SON delai, pas avec le
  # `stop_grace_period` ci-dessus, qui ne vaut que pour `docker compose stop`.
  # L'arret ordonne de ce serveur prend ~230 s (mesure du 2026-08-30 :
  # « serveur arrete proprement en 229s »), le temps que le jeu previenne les
  # joueurs puis ecrive son monde. A 10 s, Watchtower enverrait SIGKILL en
  # pleine sauvegarde a CHAQUE mise a jour -- le defaut n4 de la spec, remis en
  # place par la porte de derriere. 360 s laisse la meme marge que les 330 s de
  # stop_grace_period.
  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_TIMEOUT: 360
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_NO_RESTART: "false"
      WATCHTOWER_NOTIFICATIONS_LEVEL: "info"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
