name: Publier l'image

# La version du jeu n'est PAS epinglable : chaque build attrape celle du moment
# (docs/deploiement.md, « Limites connues »). Le filtre par chemin evite donc de
# republier une nouvelle version de jeu a chaque retouche de documentation, et
# workflow_dispatch reste la seule facon de republier deliberement apres un
# patch Stunlock, sans commit bidon.
#
# compose.yaml N'EST PAS dans le filtre : son contenu n'entre pas dans l'image.
# L'y laisser faisait reconstruire 7,5 Go pendant 30 min pour l'ajout d'un
# service voisin, et depuis Watchtower cela redemarre la production dans la
# foulee. Contrepartie assumee : si le NOM de l'image y change, aucun build ne
# part tout seul, il faut un workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/publier-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Un build dure des dizaines de minutes et pousse plusieurs Go : deux pushes
# rapproches se disputeraient le tag `latest`.
concurrency:
  group: publier-image
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKER_BUILDKIT: 1   # exige par la directive `# syntax=` du Dockerfile
    steps:
      # L'image finale pese ~7,5 Go, et ses etages intermediaires davantage :
      # les quelques Go libres d'un runner neuf n'y suffisent pas. On affiche
      # l'espace avant et apres, faute de quoi un futur ENOSPC serait muet.
      - name: Liberer de l'espace disque
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - uses: actions/checkout@v4

      # Le nom d'image vient de compose.yaml et n'est pas reconstruit ici :
      # `${{ github.repository }}` porterait la majuscule du proprietaire, que
      # GHCR refuse, et surtout ce serait une SECONDE source de verite, libre
      # de diverger de ce que le deploiement tire reellement.
      # Le SERVICE est nomme : `--images` seul rend une ligne par service dans
      # un ordre non deterministe (mesure du 2026-08-30 : 6 fois sur 12 chacun,
      # sur un compose a deux services). Sans le nom, ce job construirait et
      # pousserait une image sous le nom du service voisin une fois sur deux.
      - name: Deduire le nom d'image de compose.yaml
        run: |
          cp .env.example .env
          REF=$(docker compose config --images vrising | head -1)
          BASE=${REF%:*}
          test "$BASE" != "$REF"   # compose.yaml doit porter un tag explicite
          echo "IMAGE=$BASE" >> "$GITHUB_ENV"
          echo "VERSION=v${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Deux tags, et le numerote n'est pas decoratif : `latest` bouge a chaque
      # publication, il ne designe donc AUCUNE image en particulier des le build
      # suivant. Comme la version du jeu n'est pas epinglable, deux images
      # construites du meme commit peuvent differer -- le numero de run est la
      # seule facon de nommer celle qui fonctionnait, et donc d'y revenir.
      # Il vient de GITHUB_RUN_NUMBER : monotone, automatique, et aucune image
      # ne peut sortir sans numero. Un semver pose a la main laisserait les
      # publications ordinaires anonymes.
      # Les labels OCI portent la tracabilite vers la source, ce qu'un tag ne
      # fait pas : ils voyagent avec l'image, y compris apres un `docker pull`.
      - name: Construire
        run: |
          docker build \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE:latest" -t "$IMAGE:$VERSION" .

      # PORTE DE PUBLICATION, avant tout push. `image:` prouve que l'image
      # n'emporte ni sauvegardes ni secrets -- decisif pour un package public.
      # `runtime` prouve que Wine est bien epingle, le jeu present, steamcmd
      # absent et l'utilisateur non-root. Les deux sortent non nul si un seul
      # check echoue, ce qui arrete le job avant le registre.
      - name: Eprouver l'image avant publication
        run: |
          ./tests/verify.sh runtime
          ./tests/verify.sh "image:"

      - name: Se connecter a GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publier
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          echo "Publie : $IMAGE:latest et $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
